<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firm Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a case-file register. Summary tables first, then one card per firm, split into one panel per target market. */
:root{
  --paper:#f3f5f4; --sheet:#ffffff; --ink:#15201c; --muted:#56635d; --rule:#d5ddd9;
  --accent:#1d5c48; --accent-soft:#e1efe9; --flag:#9a3b1c; --flag-soft:#f8e7df; --warn:#7a5a00; --warn-soft:#f6efd6;
  --pl:#5b3f8f; --pl-soft:#ece6f6; --lit:#2e8b57; --tx:#c2412d;
  --f-display:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101614; --sheet:#171f1c; --ink:#e3ebe7; --muted:#9aaba3; --rule:#2c3833;
  --accent:#7cc7aa; --accent-soft:#1d3129; --flag:#f0a07f; --flag-soft:#3a2219; --warn:#e7c766; --warn-soft:#332a10;
  --pl:#c3aef0; --pl-soft:#2a2238; --lit:#5cc28a; --tx:#ec7a66; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101614; --sheet:#171f1c; --ink:#e3ebe7; --muted:#9aaba3; --rule:#2c3833;
  --accent:#7cc7aa; --accent-soft:#1d3129; --flag:#f0a07f; --flag-soft:#3a2219; --warn:#e7c766; --warn-soft:#332a10;
  --pl:#c3aef0; --pl-soft:#2a2238; --lit:#5cc28a; --tx:#ec7a66; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0}
a{color:var(--accent)} a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
header.top{display:grid;gap:10px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:var(--f-data);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(28px,4.2vw,42px);font-weight:800;letter-spacing:-.01em}
.lede{max-width:70ch;color:var(--muted);margin:0}
.src{display:inline-block;font-family:var(--f-data);font-size:10.5px;letter-spacing:.04em;padding:1px 5px;border-radius:3px;border:1px solid var(--rule);color:var(--muted);vertical-align:1px;white-space:nowrap}
.src.lb{border-color:var(--accent);color:var(--accent)}
.src.fp{border-color:var(--ink);color:var(--ink)}
.src.inf{border-color:var(--warn);color:var(--warn)}
.src.tp{border-color:var(--flag);color:var(--flag)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
section.block{margin-top:30px}
details.block{margin-top:30px}
details.block>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
details.block>summary::-webkit-details-marker{display:none}
details.block>summary::before{content:"▸";font-size:12px;color:var(--muted);transition:transform .15s;display:inline-block}
details.block[open]>summary::before{transform:rotate(90deg)}
details.block>summary h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
details.block>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tcount{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.tclear{font-family:var(--f-display);font-size:12px;font-weight:600;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:2px 9px;border-radius:999px;cursor:pointer}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable .arr{display:inline-block;width:1em;color:var(--accent)}
tr.filters th{padding:4px 6px 6px;background:var(--sheet)}
tr.filters input{width:100%;min-width:70px;font:12px var(--f-data);border:1px solid var(--rule);border-radius:4px;padding:3px 6px;background:var(--paper);color:var(--ink)}
section.block>h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.scroll{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--f-display);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
td.firm{font-family:var(--f-display);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:26px}
.seg{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.seg span{font-family:var(--f-data);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:4px}
.seg button{font-family:var(--f-display);font-size:13px;font-weight:600;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg select{font-family:var(--f-display);font-size:13px;font-weight:600;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:5px 8px;border-radius:999px;max-width:100%}
.count{font-family:var(--f-data);font-size:12px;color:var(--ink);background:var(--accent-soft);padding:4px 10px;border-radius:999px;white-space:nowrap}
a.flink{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
a.flink:hover{color:var(--accent);text-decoration-color:var(--accent)}
.jump{display:flex;flex-wrap:wrap;gap:6px 12px;font-family:var(--f-display);font-size:13px;margin-top:12px}
article.firm{margin-top:34px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.fhead{padding:18px 18px 14px;display:grid;gap:10px;border-bottom:1px solid var(--rule)}
.ftitle{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.ftitle h3{font-size:24px;font-weight:800}
.heart{font-family:var(--f-display);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1.5px solid var(--ink);color:var(--ink)}
.heart-s{font-family:var(--f-data);font-size:11px;font-weight:400;color:var(--muted);white-space:normal}
.recent{font-family:var(--f-data);font-size:10.5px;padding:0 5px;border-radius:3px;background:var(--accent);color:var(--sheet)}
.side{font-family:var(--f-data);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:3px;background:var(--accent-soft);color:var(--accent)}
.side.pl{background:var(--pl-soft);color:var(--pl)}
.side.both{background:var(--warn-soft);color:var(--warn)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px}
.fact{min-width:0}
.fact dt{font-family:var(--f-data);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fact dd{margin:2px 0 0;font-size:14px}
.split{display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--rule);margin-top:5px;max-width:220px}
.split i{display:block;background:var(--lit)} .split em{display:block;background:var(--tx)}
.split.sm{height:6px;max-width:110px;margin-top:4px}
.key{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.gbtn{font-family:var(--f-display);font-size:13px;font-weight:600;border:1px solid var(--ink);background:var(--sheet);color:var(--ink);padding:4px 11px;border-radius:999px;cursor:pointer}
dialog#gloss{border:1px solid var(--rule);border-radius:10px;padding:0;background:var(--sheet);color:var(--ink);width:min(640px,calc(100vw - 32px));max-height:min(80vh,720px)}
dialog#gloss::backdrop{background:rgba(10,16,14,.45)}
.ghead{position:sticky;top:0;background:var(--sheet);display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--rule)}
.ghead h2{font-size:18px;font-weight:800;margin:0;flex:1}
.ghead input{font:13px var(--f-data);border:1px solid var(--rule);border-radius:4px;padding:4px 8px;background:var(--paper);color:var(--ink);width:150px}
.gbody{padding:4px 16px 16px}
.gbody h3{font-size:11px;font-family:var(--f-data);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 4px}
.gbody dl{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:4px 14px;margin:0;font-size:14px}
.gbody dt{font-family:var(--f-data);font-weight:500;font-size:13px}
.gbody dd{margin:0}
.buzz{display:flex;flex-wrap:wrap;gap:6px}
.buzz q{font-size:13px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:2px 8px;quotes:"\201C" "\201D"}
.programs{background:var(--warn-soft);border-radius:6px;padding:10px 12px;font-size:14px}
.programs ul{margin:4px 0 0;padding-left:18px}
.offices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.office{padding:14px 16px 18px;border-right:1px solid var(--rule);min-width:0;display:flex;flex-direction:column;gap:10px}
.office:last-child{border-right:0}
.office h4{font-size:15px;font-weight:800;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.office h4 .mono{font-size:12px;font-weight:400;color:var(--muted)}
.office.none{color:var(--muted);font-style:italic}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.kv b{font-family:var(--f-data);font-weight:500;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.kv span{min-width:0}
.lbl{font-family:var(--f-data);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.pts{margin:0;padding-left:17px;font-size:14px;display:grid;gap:5px}
.ask{background:var(--accent-soft);border-radius:4px;padding:8px 10px;font-size:14px}
.ask::before{content:"Ask · ";font-family:var(--f-data);font-size:11px;text-transform:uppercase;color:var(--accent);letter-spacing:.06em}
.alum{font-size:13px;display:grid;gap:3px}
.alum div{display:flex;gap:6px;flex-wrap:wrap}
.alum .n{font-family:var(--f-display);font-weight:600}
.alum .t{color:var(--muted)}
.caution{font-size:13px;color:var(--flag)}
.standing{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;border-top:1px dashed var(--rule);padding-top:8px}
.standing span{min-width:0}
.standing b{font-family:var(--f-data);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:5px}
.you{display:grid;gap:7px;font-size:13px}
.you>div{display:grid;gap:1px;padding:6px 8px;border-radius:4px;background:var(--accent-soft)}
.you .row1{display:flex;flex-wrap:wrap;gap:4px 7px;align-items:baseline}
.you .n{font-family:var(--f-display);font-weight:700}
.you .t{color:var(--muted)}
.you .h{font-size:13px}
.rel{font-family:var(--f-data);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:0 5px;border-radius:3px;border:1px solid var(--accent);color:var(--accent);white-space:nowrap}
.rel.met,.rel.worked{background:var(--accent);color:var(--sheet)}
.rel.list{border-color:var(--muted);color:var(--muted)}
.cd{font-family:var(--f-data);font-size:11px;padding:0 5px;border-radius:3px;background:var(--ink);color:var(--paper);white-space:nowrap}
.cd:empty{display:none}
.empty{margin-top:30px;color:var(--muted);font-style:italic}
footer{margin-top:40px;font-size:13px;color:var(--muted);display:grid;gap:8px;max-width:80ch}
@media (max-width:860px){.offices{grid-template-columns:1fr!important}.office{border-right:0;border-bottom:1px solid var(--rule)}.office:last-child{border-bottom:0}}
@media (prefers-reduced-motion:no-preference){article.firm{transition:opacity .15s}}
</style>
</head>
<body>

<div class="wrap">
<header class="top">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="ttl"></h1>
  <p class="lede" id="lede"></p>
  <div class="legend" id="legSrc"></div>
  <div class="legend" id="legRel"></div>
</header>

<details class="block" id="timingBox" open>
  <summary><h2 id="timingH"></h2><span class="tcount" data-for="timing"></span><button type="button" class="tclear" data-for="timing" hidden>Clear sort &amp; filters</button></summary>
  <div class="scroll"><table id="timing"><thead><tr><th>Firm</th><th>Hires 1Ls?</th><th>Application</th><th>Anticipated window</th></tr></thead><tbody></tbody></table></div>
</details>

<details class="block" id="sizeBox" open>
  <summary><h2 id="sizeH"></h2><span class="tcount" data-for="size"></span><button type="button" class="tclear" data-for="size" hidden>Clear sort &amp; filters</button></summary>
  <div class="scroll"><table id="size"><thead><tr></tr></thead><tbody></tbody></table></div>
</details>

<div class="controls" role="toolbar" aria-label="Filters">
  <button type="button" class="gbtn" data-gloss>Glossary</button>
  <div class="seg" id="mkt"><span>Market</span></div>
  <div class="seg" id="sidef"><span>Side</span>
    <button type="button" data-v="all" aria-pressed="true">All</button>
    <button type="button" data-v="def" aria-pressed="false">Defense</button>
    <button type="button" data-v="pl" aria-pressed="false">Plaintiff</button>
  </div>
  <div class="seg" id="heartf"><span>Home</span></div>
  <div class="seg"><span>Alumni</span>
    <button type="button" id="recentBtn" aria-pressed="false">2020+ grads only</button>
  </div>
  <div class="seg" id="peoplef"><span>People</span>
    <button type="button" data-v="all" aria-pressed="true">All</button>
    <button type="button" data-v="mine" aria-pressed="false">With your people</button>
    <button type="button" data-v="nomet" aria-pressed="false" title="Only firms where you have not personally met or worked with a contact (includes firms with no contacts, cold/internet contacts, or contacts via a friend)">No personal contacts</button>
  </div>
  <div class="seg"><span>Sort</span>
    <select id="sortSel" aria-label="Sort firms">
      <option value="default">Dossier order</option>
      <option value="az">Name</option>
      <option value="vault">Vault rank</option>
      <option value="size">Size (US, or the selected market's office)</option>
      <option value="class">2L class (US, or selected market)</option>
      <option value="cls">School alumni</option>
      <option value="lit">Litigation share</option>
      <option value="mine">Your people</option>
    </select>
    <button type="button" id="dirBtn" aria-label="Reverse sort order"></button>
  </div>
  <span class="count" id="fitCount" role="status" aria-live="polite"></span>
</div>
<nav class="jump" id="jump" aria-label="Jump to firm"></nav>

<main id="firms"></main>

<section class="block" id="othersBox">
  <h2>Other firms that surfaced in research</h2>
  <div class="scroll"><table id="others"><thead><tr><th>Firm</th><th>Why it came up</th></tr></thead><tbody></tbody></table></div>
</section>

<footer id="foot"></footer>
</div>

<dialog id="gloss" aria-labelledby="glossTitle">
  <div class="ghead"><h2 id="glossTitle">Glossary</h2><input type="search" id="glossQ" placeholder="Search" aria-label="Search glossary"><button type="button" class="gbtn" id="glossClose">Close</button></div>
  <div class="gbody" id="glossBody"></div>
</dialog>

<script>
/* =====================================================================
   FIRM DOSSIER TEMPLATE
   Everything above this script is fixed layout. Everything a user sees
   comes from the DATA section below. Edit only CONFIG, FIRMS, OTHERS,
   GLOSSARY and FOOTER. The ENGINE section further down should not need
   changes.
   ===================================================================== */

/* ---------- helpers usable inside data strings ---------- */
const L  = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;   // linked source
const CD = d => `<span class="cd" data-d="${d}"></span>`;                                       // countdown to YYYY-MM-DD
const S  = t => `<span class="src ${t==='LB'?'lb':t==='FP'?'fp':t==='INF'?'inf':t==='3P'?'tp':''}">${t}</span>`; // source tag

/* ======================= DATA: CONFIG ======================= */
const CONFIG = {
  owner: "Keep Looking Up",                          // shown in the lede
  title: "Firm Dossier",                        // h1 and <title>
  eyebrow: "Class of 2029 · Litigation &amp; appellate · NYC + D.C.",   // small line above the title
  classLabel: "Class of 2029",                  // heading of each firm's program box and the timing table
  checked: "16 Oct 2026",                                  // date firm pages were last checked, e.g. "5 Oct 2026"
  lbYear: "2L 2027",                            // label for the Look Book hiring numbers (the class hired during the user's 1L year)
  vaultLabel: "Vault",                      // label for the Vault rank column
  school: {short:"CLS", name:"Columbia Law"},   // used for the alumni column and labels
  // 1–4 target markets: [key, label]. Keys are used in each firm's offices{} and lb{}.
  markets: [["ny","New York"],["dc","Washington, DC"]],
  // Groups for the "Home" filter: [key, label]. Each firm's home[1] must be one of these keys.
  homes: [["ny","New York"],["dc","DC"],["west","West Coast"],["other","Elsewhere"]],
  showSide: true,                               // show the Defense / Plaintiff filter
  sources: [                                    // legend for source tags; drop any the user doesn't have
    ["LB","Columbia OPSC Look Book"],
    ["WEB","firm site or press, linked"],
    ["MY","Your own notes"],
    ["AN","AN's notes (conversations he had, not your contacts)"],
    ["WWW","Columbia Who Worked Where: class of 2026 2Ls, summer 2025 (counts only)"],
    ["3P","third-party only, confirm"],
    ["INF","inferred from last cycle"]
  ],
  // relationship tags for "Your people": key -> [label, legend text]
  rel: {
    worked:["Worked with","saw your work"],
    met:["Met","you met them"],
    via:["Via a friend","a friend met them"],
    list:["Outreach","on your list, cold"]
  }
};

/* ======================= DATA: FIRMS =======================
 One object per firm, in the order the user wants them shown. Schema:
 {
  id: "short-id",                       // unique, lowercase, used for anchors
  name: "Firm Name",
  side: "def" | "pl" | "both",          // defense, plaintiff, both
  home: ["New York · litigation", "ny"],// [label after "Home:", CONFIG.homes key]
  added: "29 Sept",                     // optional badge
  facts: {
    us: "1,234 US lawyers",             // headline; starts with a number so sorting by size works
    lit: 500, corp: 400,                // practice-tag counts (null if unknown) -> green/red bar
    cls: "12 (3 in NY)",                // school alumni; starts with a number for sorting
    program: "…", assign: "…"           // summer program shape; how assignments work
  },
  buzz: ["phrase the firm uses", …],    // 3–6 short quotes from firm/recruiting material
  programs: ["1L-relevant program, with dates and amount " + S('WEB'), …],
  timing: {hires:"Yes " + S('LB'), app:"Separate 1L and 2L", window:"Opens 1 Nov 2026 " + CD("2026-11-01"), money:"$25k stipend"},
  lb: {total: 40, ny: 20, dc: 5} | null,// Look Book hires for CONFIG.lbYear; null if not in the Look Book
  std: {                                // standing line; every key optional
    v: 12,                              // Vault rank (number)
    vp: "#1 White Collar",              // Vault practice ranks
    ch: "Antitrust B1 · Appellate B2",  // Chambers bands from the tables named in FOOTER
    notes: [["2025 orders","…"]],       // any other labelled one-liners
    fp: "AmLaw 30 · PPP $3.2m · two-tier · 292 P / 293 C / 583 A (US)"
  },
  offices: {                            // one key per CONFIG.markets key; null = no office there
    ny: {
      hc: "210 · P60 C30 A120",         // headcount, starts with a number
      pa: "Lit 90 · Antitrust 20",      // practice mix
      rec: "Recruiter name, title",     // or "None listed"
      pts: ["Talking point with " + L("https://…","source"), …],  // 2–4 recent, linked
      ask: "One good question to ask a lawyer here",
      you: [["Name", "met|worked|via|list", "Title, practice", "How the user knows them / hook"]],
      alum: [["Jane Doe '22", "Associate", "Antitrust"]]          // school alumni; '22 = class year
    },
    dc: null
  }
 }
*/

const CH={app:'https://chambers.com/legal-rankings/appellate-law-usa-nationwide-5:858:12788:1',ny:'https://chambers.com/legal-rankings/litigation-general-commercial-the-elite-new-york-5:1451:12806:1',hr:'https://chambers.com/legal-rankings/litigation-general-commercial-highly-regarded-new-york-5:1147:12806:1?l=en-GB'};
const GR=["Grades","Anecdotal GPA-cutoff reports, dated "+S('3P')+" "+L('https://www.top-law-schools.com/forums/viewtopic.php?f=23&t=309563','TLS thread')];
const NOCK="Not verified yet";
const T0={hires:NOCK,app:"—",window:NOCK,money:"—"};
const off=(pts,ask,alum)=>({hc:"—",pa:"—",rec:"—",pts,ask,you:[],alum});

const SPOT={"gibson": "In Vault's 2026\u20132027 rankings, Gibson Dunn was recognized as both a Top 10 firm for Prestige and a Top 5 Best Law Firm to Work For and the firm was the only one in the nation to place in the Top 10 for both. It's a rare combination that reflects who Gibson Dunn is: a firm doing elite, high-stakes work while genuinely investing in the people who do it.", "latham": "In 2025, the firm delivered record-breaking global revenue of $8.3 billion, reflecting sustained investment in our people, practices, and fully integrated global platform. For summer associates, that means exposure to the market\u2019s most complex, high-profile matters, working alongside leading lawyers across offices and disciplines from day one.", "wilmer": "Our $25,000 1L Fellowship is designed to help students fund their 1L summer experiences working in a nonprofit public interest organization, judicial chambers, government position, and/or academia. The Fellowship will allow you to gain invaluable experience during the summer between your 1L and 2L year while exploring additional interests, building professional networks, and laying a strong foundation for an impactful and broad legal career.", "pw": "Our 2026 class of summer associates is putting that philosophy into practice. AI is integrated into our day-to-day practice and is part of all our substantive legal trainings.", "skadden": "Our summer associates gain experience comparable to that of our junior associates, including assisting senior attorneys on matters, attending client meetings, and traveling to client locations. Summer associates also participate in the Summer Program Associates\u2019 Comprehensive Education program which is designed to give summer associates a practical foundation in the skills that successful Skadden lawyers use every day, including legal writing, contract\u2026", "sc": "Sullivan &amp; Cromwell LLP is a global law firm recognized for delivering exceptional legal counsel and representation for more than 140 years. With more than 900 lawyers across 13 offices in Asia, Australia, Europe, and the United States, the Firm offers seamless cross-border service.", "wc": "Williams &amp; Connolly employs approximately 400 attorneys who focus almost exclusively on litigation from a single office in DC. One of the most selective law firms, Williams &amp; Connolly is a litigation standout known for handling complex, high-stakes matters.", "cravath": "Our lawyers come from a wide range of backgrounds and experiences, but they all share important qualities\u2014intelligence, creativity, a strong work ethic, and a desire to excel. The hallmark of our training program is our unique rotation system.", "davis": "In a unique approach, Davis Polk selects two or three outstanding associates to step away from their practices to serve as full-time Summer Program Coordinators. The Summer Coordinators meet with each summer associate throughout the program to discuss personal and professional goals and ensure each summer associate has a fulfilling and substantive experience.", "sidley": "Built to Lead\u00ae initiative is a groundbreaking associate leadership and executive development program uniquely designed to deepen associates\u2019 business acumen and leadership abilities. The program also includes title changes, to Managing Associates (4th-year associates) and Senior Managing Associates (7th-year associates), in recognition of the increased managerial responsibilities at those career stages.", "quinn": "Two cornerstones of our summer program are our Mock Trial program and the Hike. Summers spend a week working closely with partners to hone their trial skills through a series of plenary sessions and individual video review exercises.", "kirkland": "As a Kirkland lawyer, you\u2019ll launch and build an exceptional career by diving into real work of your choosing from day one. Our open assignment system empowers you to connect with partners and associates across the Firm on opportunities that align with your interests, giving you flexibility to discover the practices, industries and teams where you\u2019ll thrive.", "mayer": "Mayer Brown continues to be recognized for investing and delivering an exceptional associate experience and be a great place to work and build a legal career. Ranked \u201cThe Elite\u201d in every category for associate satisfaction \u2013 Chambers Associate Ranked in the Top 10 nationally across eight \u201cQuality of Life\u201d categories including seventh nationally for \u201cBest Law Firms to Work For\u201d \u2013 Vault Ranked in the Top 10 in nearly every US office for Mid-Level Associate\u2026", "hogan": "On July 1, 2026, Hogan Lovells and Cadwalader, Wickersham &amp; Taft combined to form Hogan Lovells Cadwalader, creating the largest law firm merger in history. The merger unites Hogan Lovells' strengths in corporate, M&amp;A, regulatory, intellectual property, and litigation matters with Cadwalader's market-leading finance, structured products, and capital markets practices.", "orrick": "We have an innovative client fellowship program open to our 2L Summer Associates, where you\u2019ll be able to spend part of your summer working with clients like Roblox, Capital One, Xcel Energy and Stripe. In 2026, Vault ranked Orrick #13 in \u201cBest Summer Associate Programs.\u201d", "arnold": "Arnold &amp; Porter's summer associate hiring process is highly intentional. The firmwide class has remained at approximately 35-40 students over the past two years, with the largest groups in New York and Washington, DC.", "cleary": "Cleary\u2019s summer associates get to work alongside teams handling some of the most innovative matters in the market. The firm recently advised on McCormick's $44.8 billion merger with Unilever's global food business, represented Tempur Sealy in its $5 billion acquisition of Mattress Firm after successfully defeating the FTC's challenge at trial, and represented Fidelity Digital Assets in a first-of-its-kind $188 million Bitcoin-backed securitized bond\u2026", "simpson": "The goal of the summer program is to introduce students to life at Simpson Thacher\u2014our practice, our people and our culture. Our summer program provides law students with a wide range of opportunities to experience the breadth of the Firm\u2019s practice, meet and engage with our attorneys, and experience the culture of the city.", "selendy": "Selendy Gay was founded in 2018 by top litigators dedicated to excellence and an inclusive culture. Associates gain meaningful experience across all facets of litigation, including client interaction, depositions, and trial work, and often have more courtroom experience than partners at big-name firms.", "weil": "When you join Weil, you are not just getting a job \u2013 you are launching a career. You will also have access to robust training and professional development programs.", "debevoise": "A hallmark of the firm is our commitment to pro bono legal services, to which we bring the same rigor and intensity as we do to our fee-earning work. Every year, the firm\u2019s lawyers work on pro bono matters that are fundamental to who we are as lawyers.", "whitecase": "Our people represent 124 nationalities and speak 95 languages. All US summer associates begin the program with the Launch Your Career (LYC) Program in New York City.", "mofo": "Morrison Foerster has been selected by the Asian American Bar Association of New York (AABANY) as the recipient of its Law Firm Leadership Award. This annual award recognizes a law firm that demonstrates exceptional leadership in cultivating legal talent, developing future leaders, and advancing equal opportunity within the legal profession.", "milbank": "Pro Bono is built into Milbank's lawyers' practices - this includes our summer associates. Here\u2019s just a sampling of pro bono work by our associates that our summers have gotten exposure to over the last few years; 1) Successfully arguing criminal appeals for wrongfully convicted individuals. 2) Advising non-profits on mergers and other corporate matters. 3) Assisting refugees and unaccompanied minor immigrants with asylum and legal status. 4) Securing\u2026", "wachtell": "Wachtell Lipton was founded on a handshake in 1965 as a small group of lawyers dedicated to providing advice and expertise at the highest levels. We have achieved extraordinary results following the distinctive vision of our founders \u2014 a cohesive team of lawyers intensely focused on solving our clients\u2019 most important problems.", "ph": "Paul Hastings is one of only three elite global firms with at least 10 Band 1 nationwide rankings in Chambers USA across its 17 core practice areas. A top law firm for associate quality of life, Paul Hastings prioritizes mentorship, training, and career development.", "cahill": "At Cahill, professional development is built on the belief that attorneys learn best through meaningful responsibility supported by exceptional training. That hands-on experience is complemented by Cahill Academy, our award-recognized professional development program, which offers comprehensive training in substantive legal skills, client service, leadership, and career development.", "omelveny": "For driven people, success is often its own reward. Recognized as a top firm for what we accomplish in the boardroom and courtroom for discerning clients the world over, we also enjoy a culture unlike any other.", "goodwin": "Lock In &amp; Go Big (Law) Podcast: We developed an external podcast for future and current law students, hosted by Legal Recruiting team members Jennifer Soltau and Genevieve Riccardelli. The series provides an inside look at what it really takes to get hired in Big Law.", "akin": "Akin\u2019s Summer Associate Program is designed to provide a well-rounded and highly personalized experience. Summer associates gain meaningful exposure through substantive client and pro bono assignments: hands-on training programs: and direct interaction with attorneys across practices and seniority levels.", "cooley": "Throughout the summer, associates take part in a condensed version of Cooley College, with courses tailored to business and litigation practices. Combined with hands-on assignments, practice group involvement, and regular feedback, the program provides a realistic and comprehensive view of practicing law at Cooley.", "dechert": "Our summer program begins with a three-day orientation in NYC, uniting firm-wide summers before the work even begins. Weekly Training Tuesdays deliver structured professional development throughout the summer, while social events such as sporting events, concerts, and cooking classes build genuine connections across offices.", "ropes": "We bring this vision to life by investing in your growth from day one, equipping you to take on the most complex legal challenges. Combined with hands-on experience and coaching from the most accomplished lawyers in the profession, this rigorous development will equip you for the demands of elite legal practice and empower you to find fulfillment in it."};

const leadNum = v => { if(v==null) return null; if(typeof v==='number') return v; const m=String(v).replace(/,/g,'').match(/^\s*(?:About\s+)?(\d+)/i); return m?+m[1]:null; };
const usSize = f => /worldwide/.test(f.facts.us||'') ? null : leadNum(f.facts.us);
function officeSize(o){ if(!o||!o.hc) return null; const hc=o.hc.replace(/,/g,''); if(/^\d/.test(hc)) return parseInt(hc,10);
  let t=0, found=false; for(const m of hc.matchAll(/(?:^|·\s*)([A-Za-z][A-Za-z ]*?)\s(\d+)/g)){ t+=+m[2]; found=true; } return found?t:null; }

  default:{f:f=>f._i, asc:true, lab:['First → last','Last → first']},

  class:{f:f=>!f.lb?null:(state.m==='all'?leadNum(sum(f.lb.total)):leadNum(f.lb[state.m])), asc:false, lab:['Biggest → smallest','Smallest → biggest']},
  cls:{f:f=>leadNum(f.facts.cls), asc:false, lab:['Most → fewest','Fewest → most']},

function fits(f){
  const showSide = !CONFIG.showSide || state.s==='all' || f.side===state.s || f.side==='both';
  const showHome = state.h==='all' || f.home[1]===state.h;
  const showMkt = state.m==='all' || !!f.offices[state.m];
  const showPeople = state.p==='all' || (state.p==='mine' ? mine(f)>0 : !hasPersonal(f, state.m));

const cellVal = td => { const t=td.textContent.replace(/\s+/g,' ').trim(); const m=t.replace(/,/g,'').match(/^#?\s*(\d+(?:\.\d+)?)/); return m?+m[1]:(t===''||t==='—'?null:t.toLowerCase()); };

      if(a.k==null&&b.k==null) return a.i-b.i; if(a.k==null) return 1; if(b.k==null) return -1;

['timing','size'].forEach(t=>{

function apply(){

    if(a.k==null && b.k==null) return a.f._i-b.f._i; if(a.k==null) return 1; if(b.k==null) return -1;
